# Reusable workflow for a workspace repo. An organisation calls it with a small file; see
# packages/github/rpi-workflow/README.md. It owns the runner, the timeout, the concurrency rule and the tokens,
# and leaves the stages to the Action in packages/github/rpi-workflow.
name: slop factory workspace run

on:
  workflow_call:
    inputs:
      model:
        description: Copilot model id for the agent. Empty uses the CLI default. Use a light model for tests.
        type: string
        required: false
        default: ''
    secrets:
      COPILOT_GITHUB_TOKEN:
        description: Token the Copilot CLI signs in with.
        required: true

# One run per issue at a time, whatever the command. A second request waits.
concurrency:
  group: slopfactory-${{ github.event.client_payload.issueNumber }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  id-token: write   # lets the last step prove to the broker who it is

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A reusable workflow cannot use a local path for an Action: it would point into the caller's repo.
      # Use @v1 once the tag exists.
      - uses: TheCloudPlumbingCo/slop-factory-pieces/packages/github/rpi-workflow@main
        with:
          # The old broker event has no command field; it only ever meant research.
          command: ${{ github.event.client_payload.command || 'research' }}
          workspace: ${{ github.event.client_payload.workspace }}
          issue: ${{ github.event.client_payload.issueNumber }}
          # The broker calls the text after the command "task". It is extra instructions; the issue is always the base input.
          instructions: ${{ github.event.client_payload.task }}
          default-branch: ${{ github.event.repository.default_branch }}
          model: ${{ inputs.model }}
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Sent by the broker. The Action asks the broker for its GitHub tokens with these and the job identity token.
          # A manual dispatch has neither, so it fails unless it passes read-token and publish-token.
          broker-origin: ${{ github.event.client_payload.brokerOrigin }}
          delivery-id: ${{ github.event.client_payload.deliveryId }}
          # A repeated hand-off carries the same id, so the Action skips the second run.
          run-id: ${{ github.event.client_payload.runId }}
